<style>
:root{
  --c-primary:#A6192E;
  --c-bg:#f3f4f6;
  --c-surface:#ffffff;
  --c-text:#1c1c1e;
  --c-muted:#6b7280;
  --c-danger:#c0392b;
  --c-success:#1f7a3d;
  --c-warning:#b8860b;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--c-primary);color:var(--c-text);font-family:Arial,Helvetica,sans-serif;}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;background:var(--c-bg);}
.appbar{background:var(--c-primary);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;gap:10px;}
.appbar-title{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.appbar-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;flex-shrink:0;min-height:40px;}
.content{flex:1;padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom));}
.actionbar{position:sticky;bottom:0;background:var(--c-surface);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e2e4e8;}
.btn{width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-secondary{background:#e7eaf0;color:var(--c-primary);border-radius:8px;padding:10px 14px;font-weight:600;border:none;cursor:pointer;}
label{display:block;margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--c-muted);}
label.label-pflicht{color:var(--c-danger);}
input[type=text],input[type=date],input[type=number],textarea{width:100%;padding:12px;border:1px solid #d4d7dd;border-radius:8px;font-size:15px;background:#fff;font-family:inherit;}
textarea{min-height:70px;resize:vertical;}
h2{margin:4px 0 10px;font-size:20px;color:var(--c-primary);}
.hint{color:var(--c-muted);font-size:13px;margin:0 0 10px;}
.fortschritt{color:var(--c-muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.thema-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;}
.thema-name{font-weight:700;font-size:16px;}
.thema-info{color:var(--c-muted);font-size:13px;margin-top:2px;}
.status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-left:10px;}
.status-leer{background:#cbd2dc;}
.status-offen{background:var(--c-warning);}
.status-ok{background:var(--c-success);}
.status-mangel{background:var(--c-danger);}
.einheit-row{background:#fff;border-radius:10px;padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;}
.muted{color:var(--c-muted);font-size:13px;}
.badge{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;margin-left:10px;}
.badge-ok{background:var(--c-success);}
.badge-mangel{background:var(--c-danger);}
.badge-offen{background:var(--c-warning);}
.jn-buttons{display:flex;gap:10px;margin-top:6px;}
.btn-jn{flex:1;padding:14px;border-radius:10px;border:2px solid #d4d7dd;background:#fff;font-size:16px;font-weight:700;color:var(--c-muted);cursor:pointer;}
.btn-jn.active-ja{background:var(--c-success);border-color:var(--c-success);color:#fff;}
.btn-jn.active-nein{background:var(--c-danger);border-color:var(--c-danger);color:#fff;}
.btn-jn.active-nerf{background:#8a8f98;border-color:#8a8f98;color:#fff;}
.zeile-eingabe{display:flex;gap:10px;margin-top:6px;}
.zeile-eingabe>div{flex:1;}
.foto-zeile{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
.foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #d4d7dd;}
.placeholder-box{background:#fff;border-radius:var(--radius);padding:20px;text-align:center;color:var(--c-muted);}
.summary-box{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eef0f3;font-size:14px;}
.summary-row:last-child{border-bottom:none;}
.summary-mangel{color:var(--c-danger);font-weight:700;}
.sig-block{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.sig-block-title{font-weight:700;font-size:15px;margin-bottom:8px;}
.sig-canvas-wrap{position:relative;border:1.5px dashed #c7cbd3;border-radius:8px;background:#fbfbfc;touch-action:none;}
.sig-canvas{width:100%;height:140px;display:block;touch-action:none;border-radius:8px;}
.sig-placeholder{position:absolute;top:50%;left:0;width:100%;text-align:center;transform:translateY(-50%);color:#b9bdc6;font-size:13px;pointer-events:none;}
.sig-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.sig-name{font-size:12px;color:var(--c-muted);}
.export-row{display:flex;flex-direction:column;gap:10px;}
.btn-export{width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;}
.btn-export-pdf{background:var(--c-primary);color:#fff;}
.btn-export-zip{background:#e7eaf0;color:var(--c-primary);}
.export-status{text-align:center;font-size:13px;color:var(--c-muted);margin-top:8px;min-height:16px;}
.subthema-heading{font-size:14px;font-weight:700;color:var(--c-text);margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;}
.subthema-heading:first-of-type{margin-top:4px;}
.frage-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.frage-card.frage-offen{border-left:4px solid var(--c-danger);}
.frage-card.frage-unvollstaendig{border-left:4px solid #e0a300;background:#fffaf0;}
.frage-card.frage-ok{border-left:4px solid var(--c-success);}
.frage-titel{font-size:15px;font-weight:700;margin:0 0 2px;}
.frage-hint{color:var(--c-muted);font-size:12px;margin:0 0 8px;}
.frage-card label{margin:10px 0 4px;}
.frage-card textarea{min-height:60px;}
.fortschritt-gesamt{font-size:13px;color:var(--c-muted);margin-bottom:14px;}
.speicher-warnung{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:var(--c-danger);color:#fff;font-size:13px;font-weight:700;line-height:1.4;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.25);}
.foto-thumb{background:#eef0f3;}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<script>
(function(){
'use strict';
var memoryFallback = {};
var speicherWarnungAktiv = false;
function storageGet(key){
  try { return localStorage.getItem(key); } catch(e){ return memoryFallback[key] || null; }
}
// Liefert true bei Erfolg. Schlaegt das Schreiben fehl, landen die Daten in einer
// fluechtigen Variablen -- das MUSS der Pruefer sehen, sonst verliert er die Begehung.
function storageSet(key, value){
  try { localStorage.setItem(key, value); return true; }
  catch(e){ memoryFallback[key] = value; zeigeSpeicherWarnung('Der Gerätespeicher ist voll. Die Begehung wird nur noch flüchtig gehalten und geht beim Schließen der App verloren. Bitte den Bericht JETZT exportieren.'); return false; }
}
function zeigeSpeicherWarnung(text){
  if(speicherWarnungAktiv) return;
  speicherWarnungAktiv = true;
  var bar = document.getElementById('speicherWarnung');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'speicherWarnung';
    bar.className = 'speicher-warnung';
    document.body.appendChild(bar);
  }
  bar.textContent = '\u26A0 ' + text;
  bar.style.display = 'block';
}

// ---------------------------------------------------------------------------
// FOTOSPEICHER (IndexedDB)
// Fotos liegen NICHT mehr im localStorage-Zustand, sondern als Blob in IndexedDB.
// Im Zustand steht nur noch die ID. Damit sind >=100 Einheiten mit >=200 Fotos
// moeglich, ohne das 5-MB-Limit von localStorage zu reissen.
// ---------------------------------------------------------------------------
var FotoStore = (function(){
  var DB_NAME = 'fisc_fotos', DB_VERSION = 1, STORE = 'fotos';
  var dbPromise = null;
  function db(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error('IndexedDB nicht verfügbar')); return; }
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(){
        var d = req.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function tx(mode, fn){
    return db().then(function(d){
      return new Promise(function(resolve, reject){
        var t = d.transaction(STORE, mode);
        var st = t.objectStore(STORE);
        var out = fn(st);
        t.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function(){ reject(t.error); };
        t.onabort = function(){ reject(t.error || new Error('Transaktion abgebrochen')); };
      });
    });
  }
  return {
    verfuegbar: function(){ return !!window.indexedDB; },
    put: function(blob){
      var id = 'f_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
      return tx('readwrite', function(st){ st.put(blob, id); }).then(function(){ return id; });
    },
    putMitId: function(id, blob){
      return tx('readwrite', function(st){ st.put(blob, id); }).then(function(){ return id; });
    },
    get: function(id){ return tx('readonly', function(st){ return st.get(id); }); },
    alle: function(){ return tx('readonly', function(st){ return st.getAllKeys(); }); },
    leeren: function(){ return tx('readwrite', function(st){ st.clear(); }); }

// Blob -> DataURL (fuer jsPDF), optional auf maxW herunterskaliert.
function blobZuDataUrl(blob, maxW, quality){
  return new Promise(function(resolve){
    if(!blob){ resolve(null); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      if(!maxW){ resolve(e.target.result); return; }
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxW / img.width);
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality || 0.7));
      };
      img.onerror = function(){ resolve(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ resolve(null); };
    reader.readAsDataURL(blob);
  });
}

var sichtbareObjektUrls = [];

}
function hydriereFotos(){
  var imgs = document.querySelectorAll('img[data-foto]');
  for(var i=0;i<imgs.length;i++){
    (function(el){
      var id = el.getAttribute('data-foto');
      if(!id) return;
      FotoStore.get(id).then(function(blob){
        if(!blob) return;
        var url = URL.createObjectURL(blob);
        sichtbareObjektUrls.push(url);

      }).catch(function(){});
    })(imgs[i]);
  }
}

  }
  if(!antwort.wert) return false;
  if(brauchtBemerkungPflicht(frage, antwort) && !antwort.bemerkung) return false;
  if(brauchtFotoPflicht(frage, antwort) && !antwort.foto) return false;

}
function unvollstaendigeFragenFuer(einheit, def){
  var liste = [];
  var subthemen = aktiveSubthemenFuer(einheit, def);
  var ids = aktiveSubthemenIds(einheit, def);
  var hatMangelInhaltlich = einheitHatMangelInhaltlich(einheit, def);
  subthemen.forEach(function(sub){
    sichtbareFragen(sub, ids, hatMangelInhaltlich).forEach(function(frage){
      var a = einheit.antworten[antwortKey(sub.id, frage.id)];
      if(!antwortVollstaendig(frage, a)){
        liste.push(sub.label + ': ' + frage.text);
      }
    });
  });
  return liste;
}
function aktiveSubthemenFuer(einheit, def){
  if(einheit.istNeu && def.neuCheck) return [def.neuCheck];
  if(!einheit.aktiveSubthemen) return def.subthemen; // Altdaten ohne dieses Feld: wie bisher alle Subthemen
  return def.subthemen.filter(function(sub){ return einheit.aktiveSubthemen.indexOf(sub.id) !== -1; });
}
function aktiveSubthemenIds(einheit, def){
  return aktiveSubthemenFuer(einheit, def).map(function(sub){ return sub.id; });
}
function sichtbareFragen(sub, aktiveIds, hatMangelInhaltlich){
  return sub.fragen.filter(function(frage){
    if(frage.versteckenWenn && frage.versteckenWenn.some(function(id){ return aktiveIds.indexOf(id) !== -1; })) return false;
    if(frage.versteckenBeiMangel && hatMangelInhaltlich) return false;
    return true;
  });
}
function einheitHatMangelInhaltlich(einheit, def){
  var subthemen = aktiveSubthemenFuer(einheit, def);
  var ids = aktiveSubthemenIds(einheit, def);
  for(var s=0;s<subthemen.length;s++){
    var sub = subthemen[s];
    var fragen = sichtbareFragen(sub, ids, false).filter(function(f){ return !f.versteckenBeiMangel; });
    for(var f=0;f<fragen.length;f++){
      var a = einheit.antworten[antwortKey(sub.id, fragen[f].id)];
      if(a && isMangel(fragen[f], a)) return true;
    }
  }
  return false;
}
function einheitHatMangel(einheit, def){
  var subthemen = aktiveSubthemenFuer(einheit, def);
  var ids = aktiveSubthemenIds(einheit, def);
  var hatMangelInhaltlich = einheitHatMangelInhaltlich(einheit, def);
  for(var s=0;s<subthemen.length;s++){
    var sub = subthemen[s];
    var fragen = sichtbareFragen(sub, ids, hatMangelInhaltlich);
    for(var f=0;f<fragen.length;f++){
      var a = einheit.antworten[antwortKey(sub.id, fragen[f].id)];
      if(a && isMangel(fragen[f], a)) return true;
    }
  }
  return false;
}
function einheitVollstaendig(einheit, def){
  var subthemen = aktiveSubthemenFuer(einheit, def);
  var ids = aktiveSubthemenIds(einheit, def);
  var hatMangelInhaltlich = einheitHatMangelInhaltlich(einheit, def);
  for(var s=0;s<subthemen.length;s++){
    var sub = subthemen[s];
    var fragen = sichtbareFragen(sub, ids, hatMangelInhaltlich);
    for(var f=0;f<fragen.length;f++){
      var a = einheit.antworten[antwortKey(sub.id, fragen[f].id)];
      if(!antwortVollstaendig(fragen[f], a)) return false;
    }
  }
  return true;
}

// Liefert einen JPEG-Blob (nicht mehr eine DataURL) -- Blobs kosten in IndexedDB
// rund ein Drittel weniger Platz als die Base64-Fassung.
function resizeImage(file, maxWidth, quality, callback){
  var img = new Image();
  var reader = new FileReader();
  reader.onload = function(e){
    img.onload = function(){
      var scale = Math.min(1, maxWidth / img.width);
      var w = Math.round(img.width * scale);
      var h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      if(canvas.toBlob){
        canvas.toBlob(function(blob){ callback(blob, w, h); }, 'image/jpeg', quality);
      } else {
        var du = canvas.toDataURL('image/jpeg', quality);
        callback(dataUrlZuBlob(du), w, h);
      }
    };
    img.onerror = function(){ callback(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}
function dataUrlZuBlob(dataUrl){
  var teile = dataUrl.split(',');
  var mime = (teile[0].match(/:(.*?);/) || [null,'image/jpeg'])[1];
  var bin = atob(teile[1]);
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}

function initSignaturePad(canvasId, stateKey){
  var canvas = document.getElementById(canvasId);
  if(!canvas) return;
  if(sigCleanup[canvasId]){ sigCleanup[canvasId](); delete sigCleanup[canvasId]; }
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  var cssW = rect.width || canvas.parentNode.getBoundingClientRect().width || 300;
  var cssH = 140;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#1c1c1e';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var existing = state.unterschriften[stateKey];
  if(existing){
    var img = new Image();
    img.onload = function(){ ctx.drawImage(img, 0, 0, cssW, cssH); };
    img.src = existing;
  }
  var drawing = false, lastX = 0, lastY = 0, touched = !!existing;
  function pos(e){
    var r = canvas.getBoundingClientRect();
    if(e.touches && e.touches.length){ return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }; }
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function hidePlaceholder(){
    var ph = document.getElementById(stateKey==='sachkundiger' ? 'ph_sachkundiger' : 'ph_kunde');
    if(ph) ph.style.display = 'none';
  }
  function start(e){ drawing = true; touched = true; hidePlaceholder(); var p = pos(e); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y; e.preventDefault();
  }
  function finish(){
    if(!drawing) return;
    drawing = false;
    if(touched){ state.unterschriften[stateKey] = canvas.toDataURL('image/png'); saveState(); }
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  document.addEventListener('mouseup', finish);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', finish);
  sigCleanup[canvasId] = function(){
    document.removeEventListener('mouseup', finish);
  };
}

// Fuer die PDF-Erzeugung werden die benoetigten Fotos einmalig als DataURL
// vorgeladen -- verkleinert, damit ein Bericht mit 200 Fotos nicht den
// Arbeitsspeicher des Geraets sprengt. Die Originale bleiben im ZIP.
var PDF_FOTOS = {};
var PDF_FOTO_MAXBREITE = 700;
var PDF_FOTO_QUALITAET = 0.62;
function sammleFotoIds(themaKeys){
  var ids = [];
  (themaKeys || THEMA_ORDER).forEach(function(themaKey){
    var def = LEITFADEN[themaKey];
    getThemaState(themaKey).einheiten.forEach(function(einheit){
      if(einheit.stammdatenFoto) ids.push(einheit.stammdatenFoto);
      Object.keys(einheit.antworten || {}).forEach(function(k){
        var a = einheit.antworten[k];
        if(a && a.foto) ids.push(a.foto);
      });
    });
  });
  return ids.filter(function(id, i){ return ids.indexOf(id) === i; });
}
function ladePdfFotos(ids, fortschritt){
  PDF_FOTOS = {};
  var i = 0;
  function naechstes(){
    if(i >= ids.length) return Promise.resolve();
    var id = ids[i++];
    if(fortschritt) fortschritt(i, ids.length);
    return FotoStore.get(id)
      .then(function(blob){ return blobZuDataUrl(blob, PDF_FOTO_MAXBREITE, PDF_FOTO_QUALITAET); })
      .then(function(du){ if(du) PDF_FOTOS[id] = du; })
      .catch(function(){})
      .then(naechstes);
  }
  return naechstes();
}
function pdfFoto(id){ return (id && PDF_FOTOS[id]) || null; }

function folgepruefungText(datumStr, intervallJahre){
  if(!datumStr) return '–';
  var teile = datumStr.split('-');
  var jahr = parseInt(teile[0],10) + (intervallJahre || 1);
  var monatIdx = parseInt(teile[1],10) - 1;
  if(isNaN(jahr) || isNaN(monatIdx) || monatIdx<0 || monatIdx>11) return '–';
  return MONATSNAMEN[monatIdx] + ' ' + jahr;
}

    cy += 16;

    (meta.hinweise || []).forEach(function(hinweis){
      var lines = doc.splitTextToSize(hinweis, pageW - 2*PDF_MARGIN - 14);
      platzPruefen(lines.length * 11 + 6);
      doc.setTextColor(90,90,90);
      doc.setFont(undefined,'normal');
      doc.text('•', PDF_MARGIN, cy);
      doc.text(lines, PDF_MARGIN + 14, cy);
      cy += lines.length * 11 + 5;
    });
    cy += 12;
    doc.setDrawColor(225,225,225);
    platzPruefen(14);
    doc.line(PDF_MARGIN, cy, pageW - PDF_MARGIN, cy);
    cy += 18;
  });
}

function buildPdfDoc(themaKeysParam){
  var themaKeys = themaKeysParam || THEMA_ORDER;
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit:'pt', format:'a4' });
  var pageW = doc.internal.pageSize.getWidth();
  var pageH = doc.internal.pageSize.getHeight();
  var k = state.kopfdaten;
  var firstPage = true;

  function neueSeite(){
    if(!firstPage) doc.addPage();
    firstPage = false;
  }

  // ---------- DECKBLATT ----------
  neueSeite();
  try {
    var logoProps = doc.getImageProperties(FLAMMPUNKT_LOGO_BASE64);
    var logoMaxW = 170, logoMaxH = 62;
    var logoScale = Math.min(logoMaxW/logoProps.width, logoMaxH/logoProps.height);
    var lw = logoProps.width*logoScale, lh = logoProps.height*logoScale;
    doc.addImage(FLAMMPUNKT_LOGO_BASE64, 'PNG', (pageW-lw)/2, 130, lw, lh);
  } catch(e){}
  doc.setFontSize(13);
  doc.setTextColor(60,60,60);
  doc.setFont(undefined,'bold');
  doc.text(FLAMMPUNKT_FIRMA, pageW/2, 215, { align:'center' });
  doc.setFontSize(26);
  doc.setTextColor(166,25,46);
  doc.text('Brandschutz-Prüfbericht', pageW/2, 280, { align:'center' });
  doc.setFontSize(11);
  doc.setTextColor(90,90,90);
  doc.setFont(undefined,'normal');
  doc.text(k.kunde||'', pageW/2, 320, { align:'center' });
  doc.text(k.adresse||'', pageW/2, 336, { align:'center' });
  doc.text('Datum: ' + (k.datum||'–'), pageW/2, 356, { align:'center' });

  var deckblattThemen = themaKeys.filter(function(key){ return getThemaState(key).einheiten.length>0; });
  if(deckblattThemen.length>0){
    var einleitungY = 390;
    doc.setFontSize(9.5);
    doc.setTextColor(70,70,70);
    doc.setFont(undefined,'normal');
    deckblattThemen.forEach(function(key){
      var def = LEITFADEN[key];
      var meta = THEMA_META[key];
      var zeileText = 'Überprüfung der ' + def.einheitLabelPlural + ' gemäß ' + normKurzFuerThema(key) + '.';
      var zeilenLines = doc.splitTextToSize(zeileText, pageW - 2*PDF_MARGIN - 80);
      doc.text(zeilenLines, pageW/2, einleitungY, { align:'center' });
      einleitungY += zeilenLines.length * 13 + 6;
    });
  }

  // ---------- PRÜFBERICHTE: eine Seite pro Einheit, unabhaengig vom Status ----------
  themaKeys.forEach(function(themaKey){
    var def = LEITFADEN[themaKey];
    var meta = THEMA_META[themaKey];
    var ts = getThemaState(themaKey);
    ts.einheiten.forEach(function(einheit){
      neueSeite();
      renderPruefberichtSeite(doc, def, meta, einheit, pageW, pageH);
    });
  });

  // ---------- MÄNGELBERICHT: eine Seite pro einzelnem Mangel ----------
  var alleMaengel = [];
  themaKeys.forEach(function(themaKey){
    var def = LEITFADEN[themaKey];
    var meta = THEMA_META[themaKey];
    var ts = getThemaState(themaKey);
    ts.einheiten.forEach(function(einheit){
      var aktiveIds = aktiveSubthemenIds(einheit, def);
      var hatMangelInhaltlich = einheitHatMangelInhaltlich(einheit, def);
      aktiveSubthemenFuer(einheit, def).forEach(function(sub){
        sichtbareFragen(sub, aktiveIds, hatMangelInhaltlich).forEach(function(frage){
          var antwort = einheit.antworten[antwortKey(sub.id, frage.id)];
          if(isMangel(frage, antwort)){
            alleMaengel.push({ def:def, meta:meta, einheit:einheit, frage:frage, antwort:antwort });
          }
        });
      });
    });
  });
  alleMaengel.forEach(function(m, idx){
    neueSeite();
    renderMangelSeite(doc, m, idx+1, alleMaengel.length, pageW, pageH);
  });

  // ---------- ZUSAMMENFASSUNG + UNTERSCHRIFTEN ----------
  neueSeite();
  doc.setFontSize(18);
  doc.setTextColor(166,25,46);
  doc.setFont(undefined,'bold');
  doc.text('Zusammenfassung', PDF_MARGIN, 90);
  doc.setFontSize(12);
  doc.setTextColor(40,40,40);
  var y = 130;
  function zeile(label, wert){
    doc.setFont(undefined,'bold'); doc.text(label, PDF_MARGIN, y);
    doc.setFont(undefined,'normal'); doc.text(String(wert||'–'), PDF_MARGIN+140, y);
    y += 20;
  }
  zeile('Kunde:', k.kunde);
  zeile('Adresse:', k.adresse);
  zeile('Datum:', k.datum);
  zeile('Objekt-/Anlagen-Nr.:', k.objektNr);
  zeile('Prüfer:', k.pruefer);
  y += 10;
  var gesamtMangel = gesamtMangelAnzahl(themaKeys);
  var gesamtEinheiten = gesamtEinheitenAnzahl(themaKeys);
  doc.setFont(undefined,'bold');
  doc.setTextColor(gesamtMangel>0 ? 192 : 31, gesamtMangel>0 ? 57 : 122, gesamtMangel>0 ? 43 : 61);
  doc.text(gesamtEinheiten + (gesamtEinheiten===1 ? ' Anlage/Gerät geprüft, ' : ' Anlagen/Geräte geprüft, ') + gesamtMangel + (gesamtMangel===1 ? ' Mangel' : ' Mängel') + ' insgesamt', PDF_MARGIN, y);
  doc.setTextColor(40,40,40);
  doc.setFont(undefined,'normal');
  y += 30;
  themaKeys.forEach(function(key){
    var def = LEITFADEN[key];
    var ts = getThemaState(key);
    if(ts.einheiten.length===0) return;
    var defekt = ts.einheiten.filter(function(e){ return einheitHatMangel(e, def); }).length;
    var bestanden = ts.einheiten.length - defekt;
    var teil = bestanden + 'x Bestanden';
    if(defekt>0) teil += ', ' + defekt + 'x Defekt';
    doc.text('• ' + def.label + ': ' + teil, PDF_MARGIN, y);
    y += 18;
  });
  y += 14;

  var relevanteThemen = themaKeys.filter(function(key){ return getThemaState(key).einheiten.length>0; });
  var relevanteNormen = relevanteThemen.map(function(key){ return normKurzFuerThema(key); });
  var normenText = relevanteNormen.join('; ');
  var kuerzestesIntervall = relevanteThemen.reduce(function(min, key){
    var iv = THEMA_META[key].pruefintervallJahre || 1;
    return (min===null || iv<min) ? iv : min;
  }, null);
  var abschlussText;
  if(gesamtMangel === 0){
    abschlussText = 'Ihr Objekt ist mangelfrei. Die Überprüfung wurde gemäß ' + normenText + ' durchgeführt. Folgeprüfung empfohlen: ' + folgepruefungText(k.datum, kuerzestesIntervall) + '.';
  } else {
    abschlussText = 'Die Brandschutzüberprüfung nach ' + normenText + ' Ihres Objektes ist leider mangelhaft ausgefallen. Die im Mängelbericht aufgeführten Punkte gilt es abzustellen, um das Erlöschen Ihres Versicherungsschutzes zu verhindern.';
  }
  doc.setFontSize(10);
  doc.setTextColor(40,40,40);
  doc.setFont(undefined,'normal');
  var abschlussLines = doc.splitTextToSize(abschlussText, pageW - 2*PDF_MARGIN);
  doc.text(abschlussLines, PDF_MARGIN, y);
  y += abschlussLines.length * 14 + 20;

  var alleEinheitenFlat = [];
  themaKeys.forEach(function(key){
    var def = LEITFADEN[key];
    var ts = getThemaState(key);
    ts.einheiten.forEach(function(e){
      alleEinheitenFlat.push({ label: def.einheitLabel, nummer: e.nummer, standort: e.standort, mangel: einheitHatMangel(e, def) });
    });
  });
  if(alleEinheitenFlat.length > 0){
    doc.setFontSize(9);
    doc.setTextColor(120,120,120);
    doc.setFont(undefined,'bold');
    doc.text('Geprüfte Objekte im Überblick', PDF_MARGIN, y);
    y += 13;
    doc.setFontSize(8);
    doc.setFont(undefined,'normal');
    alleEinheitenFlat.forEach(function(item){
      if(y > pageH - PDF_FOOTER_RESERVE - 10){ doc.addPage(); y = PDF_MARGIN + 10; }
      var links = item.label + ' ' + item.nummer + ' – ' + item.standort;
      if(item.mangel){
        doc.setTextColor(180,60,50);
        doc.setFont(undefined,'bold');
        doc.text(links, PDF_MARGIN, y);
        doc.text('Defekt', pageW - PDF_MARGIN, y, { align:'right' });
        doc.setFont(undefined,'normal');
      } else {
        doc.setTextColor(130,130,130);
        doc.text(links, PDF_MARGIN, y);
        doc.text('i.O.', pageW - PDF_MARGIN, y, { align:'right' });
      }
      y += 11;
    });
    doc.setTextColor(40,40,40);
    y += 16;
  }

  if(y > pageH - 200){ doc.addPage(); y = PDF_MARGIN + 10; }
  doc.setFontSize(14);
  doc.setTextColor(166,25,46);
  doc.setFont(undefined,'bold');
  doc.text('Unterschriften', PDF_MARGIN, y+10);
  var sy = y + 50;
  var u = state.unterschriften;
  doc.setFontSize(10);
  doc.setTextColor(40,40,40);
  doc.setFont(undefined,'normal');
  doc.text('Sachkundiger / Prüfer: ' + (k.pruefer||'–'), PDF_MARGIN, sy);
  sy += 10;
  if(u.sachkundiger){
    try { doc.addImage(u.sachkundiger, 'PNG', PDF_MARGIN, sy, 220, 70); } catch(e){}
  }
  doc.setDrawColor(180,180,180);
  doc.line(PDF_MARGIN, sy+78, PDF_MARGIN+220, sy+78);
  sy += 100;
  doc.text('Kunde:', PDF_MARGIN, sy);
  sy += 10;
  if(u.kunde){
    try { doc.addImage(u.kunde, 'PNG', PDF_MARGIN, sy, 220, 70); } catch(e){}
  }
  doc.line(PDF_MARGIN, sy+78, PDF_MARGIN+220, sy+78);

  // ---------- ANLAGE: NORMATIVE GRUNDLAGEN ----------
  neueSeite();
  renderNormAnlage(doc, themaKeys, pageW, pageH, k.datum);

  // Fußzeile mit Logo auf jeder Seite
  var totalPages = doc.internal.getNumberOfPages();
  for(var p=1; p<=totalPages; p++){
    doc.setPage(p);
    drawFlammpunktFooter(doc, p, totalPages, pageW, pageH);
  }

  return doc;
}

function drawFlammpunktFooter(doc, pageNum, totalPages, pageW, pageH){
  var footerY = pageH - 50;
  doc.setDrawColor(210,210,210);
  doc.line(PDF_MARGIN, footerY, pageW - PDF_MARGIN, footerY);
  var maxLogoW = 70, maxLogoH = 26;
  var textX = PDF_MARGIN;
  try {
    var props = doc.getImageProperties(FLAMMPUNKT_LOGO_BASE64);
    var scale = Math.min(maxLogoW / props.width, maxLogoH / props.height);
    var logoW = props.width * scale;
    var logoH = props.height * scale;
    doc.addImage(FLAMMPUNKT_LOGO_BASE64, 'PNG', PDF_MARGIN, footerY + 8 + (maxLogoH-logoH)/2, logoW, logoH);
    textX = PDF_MARGIN + maxLogoW + 10;
  } catch(e){}
  doc.setFontSize(7.5);
  doc.setTextColor(110,110,110);
  doc.setFont(undefined,'normal');
  doc.text(FLAMMPUNKT_FIRMA, textX, footerY + 16);
  doc.text(FLAMMPUNKT_ADRESSE + ' · Tel. ' + FLAMMPUNKT_TELEFON + ' · ' + FLAMMPUNKT_EMAIL, textX, footerY + 26);
  doc.text('Seite ' + pageNum + ' / ' + totalPages, pageW - PDF_MARGIN, footerY + 21, { align:'right' });
}
function buildZipBlob(pdfBlob, callback, fortschritt){
  var zip = new JSZip();
  zip.file(dateienName('Bericht','pdf'), pdfBlob);
  THEMA_ORDER.forEach(function(themaKey){
    if(getThemaState(themaKey).einheiten.length === 0) return;
    var def = LEITFADEN[themaKey];
    var einzelDoc = buildPdfDoc([themaKey]);
    var einzelName = dateienName('Einzelbericht_' + def.label.replace(/[^a-z0-9äöüß]+/gi,'_'), 'pdf');
    zip.file(einzelName, einzelDoc.output('blob'));
  });

  // Fotos: Originalauflösung aus IndexedDB, nicht die für das PDF verkleinerte Fassung.
  // Erfasst werden auch Stammdatenfotos und Fotos aus der Neuanlage-Kurzprüfung.
  var fotosOrdner = zip.folder('Fotos');
  var zaehler = {};
  var auftraege = [];
  THEMA_ORDER.forEach(function(themaKey){
    var def = LEITFADEN[themaKey];
    getThemaState(themaKey).einheiten.forEach(function(einheit){
      var basis = (def.label + '_' + einheit.nummer).replace(/[^a-z0-9äöüß]+/gi,'_');
      function merken(id, suffix){
        if(!id) return;
        zaehler[basis] = (zaehler[basis]||0) + 1;
        auftraege.push({ id:id, name: basis + '_' + zaehler[basis] + (suffix||'') + '.jpg' });
      }
      merken(einheit.stammdatenFoto, '_Uebersicht');
      var alleSubs = (def.subthemen || []).concat(def.neuCheck ? [def.neuCheck] : []);
      alleSubs.forEach(function(sub){
        sub.fragen.forEach(function(frage){
          var antwort = einheit.antworten[antwortKey(sub.id, frage.id)];
          if(antwort && antwort.foto) merken(antwort.foto);
        });
      });
    });
  });

  var i = 0;
  function naechstes(){
    if(i >= auftraege.length){
      zip.generateAsync({ type:'blob' }).then(function(blob){ callback(blob); });
      return;
    }
    var auftrag = auftraege[i++];
    if(fortschritt) fortschritt(i, auftraege.length);
    FotoStore.get(auftrag.id).then(function(blob){
      if(blob) fotosOrdner.file(auftrag.name, blob);
      naechstes();
    }).catch(naechstes);
  }
  naechstes();
}
window.AppActions = {
  setField: function(path, value){
    setPath(state, path, value);
    saveStateVerzoegert();
  },
  goStart: function(){ state.screen = 'start'; render(); },
  goDashboard: function(){
    if(!state.kopfdaten.kunde || !state.kopfdaten.pruefer){
      alert('Bitte Kunde und Prüfer ausfüllen.');
      return;
    }
    state.screen = 'dashboard'; render();
  },
  openThema: function(themaKey){
    state.nav = { themaKey: themaKey };
    state.screen = 'einheiten';
    render();
  },
  goEinheiten: function(themaKey){
    state.nav = { themaKey: themaKey };
    state.screen = 'einheiten';
    render();
  },
  goNeueEinheit: function(){ state.screen = 'neueEinheit'; render(); },
  legeEinheitAn: function(){
    var nummer = document.getElementById('neuNummer').value.trim();
    var standort = document.getElementById('neuStandort').value.trim();
    if(!nummer || !standort){ alert('Bitte Nummer und Standort angeben.'); return; }
    var themaKey = state.nav.themaKey;
    var def = LEITFADEN[themaKey];
    var ts = getThemaState(themaKey);
    var istNeuEl = document.getElementById('istNeu');
    var istNeu = !!(istNeuEl && istNeuEl.checked);
    var einheit;
    if(istNeu){
      einheit = { id: uid(), nummer: nummer, standort: standort, antworten: {}, istNeu: true };
    } else {
      var aktiveSubthemen;
      if(def.subthemen.length > 1){
        var pflichtIds = def.subthemen.filter(function(s){ return s.pflicht; }).map(function(s){ return s.id; });
        var optionaleIds = def.subthemen
          .filter(function(s){ return !s.pflicht; })
          .filter(function(sub){ var el = document.getElementById('subAktiv_'+sub.id); return el && el.checked; })
          .map(function(s){ return s.id; });
        aktiveSubthemen = pflichtIds.concat(optionaleIds);
        if(aktiveSubthemen.length === 0){ alert('Bitte mindestens einen Prüfabschnitt auswählen.'); return; }
      } else {
        aktiveSubthemen = def.subthemen.map(function(sub){ return sub.id; });
      }
      einheit = { id: uid(), nummer: nummer, standort: standort, antworten: {}, aktiveSubthemen: aktiveSubthemen };
    }
    ts.einheiten.push(einheit);
    state.nav = { themaKey: themaKey, einheitId: einheit.id };
    state.screen = 'wizard';
    render();
  },
  bearbeiteEinheit: function(){
    var einheit = currentEinheit();
    var neueNummer = prompt('Nummer/Bezeichnung', einheit.nummer);
    if(neueNummer === null) return;
    var neuerStandort = prompt('Standort', einheit.standort);
    if(neuerStandort === null) return;
    neueNummer = neueNummer.trim();
    neuerStandort = neuerStandort.trim();
    if(!neueNummer || !neuerStandort){ alert('Nummer und Standort dürfen nicht leer sein.'); return; }
    einheit.nummer = neueNummer;
    einheit.standort = neuerStandort;
    saveState();
    render();
  },
  kopiereEinheit: function(einheitId){
    var themaKey = state.nav.themaKey;
    var ts = getThemaState(themaKey);
    var original = ts.einheiten.find(function(e){ return e.id === einheitId; });
    if(!original) return;
    var kopie = JSON.parse(JSON.stringify(original));
    kopie.id = uid();
    kopie.nummer = naechsteFreieNummer(ts.einheiten);
    kopie.standort = /^\d+$/.test(kopie.nummer) ? (kopie.nummer + '.1') : ((original.standort||'') + ' (Kopie)');
    ts.einheiten.push(kopie);
    saveState();
    render();
  },
  loescheEinheit: function(einheitId){
    var themaKey = state.nav.themaKey;
    var ts = getThemaState(themaKey);
    var einheit = ts.einheiten.find(function(e){ return e.id === einheitId; });
    if(!einheit) return;
    if(!confirm('"'+einheit.nummer+'" ('+einheit.standort+') wirklich löschen?\n\nDas kann nicht rückgängig gemacht werden.')) return;
    ts.einheiten = ts.einheiten.filter(function(e){ return e.id !== einheitId; });
    saveState();
    render();
  },
  openEinheit: function(einheitId){
    state.nav.einheitId = einheitId;
    state.screen = 'wizard';
    render();
  },
  setWertFuer: function(subId, frageId, feld, wert){
    var antwort = getAntwortFor(currentEinheit(), subId, frageId);
    antwort[feld] = wert;
    saveState();
    render();
  },
  setBemerkungFuer: function(subId, frageId, text){
    var antwort = getAntwortFor(currentEinheit(), subId, frageId);
    antwort.bemerkung = text;
    saveStateVerzoegert();
  },
  nimmFotoFuer: function(subId, frageId){
    fotoZiel = { subId: subId, frageId: frageId };
    document.getElementById('cameraInput').click();
  },
  setStammdatenFeld: function(feld, wert){
    var einheit = currentEinheit();
    if(!einheit.stammdaten) einheit.stammdaten = {};
    einheit.stammdaten[feld] = wert;
    saveStateVerzoegert();
  },
  nimmStammdatenFoto: function(){
    fotoZiel = { subId: '__stammdaten__', frageId: 'foto' };
    document.getElementById('cameraInput').click();
  },
  fertigEinheit: function(){
    var def = LEITFADEN[state.nav.themaKey];
    var einheit = currentEinheit();
    var fehlend = unvollstaendigeFragenFuer(einheit, def);
    if(fehlend.length > 0){
      alert('Noch nicht vollständig (gelb markierte Karten):\n\n– ' + fehlend.join('\n– '));
      return;
    }
    state.screen = 'einheiten';
    render();
  },
  goEinheitenVonWizard: function(){
    state.screen = 'einheiten';
    render();
  },
  goAbschluss: function(){ state.screen = 'abschluss'; render(); },
  signaturLoeschen: function(stateKey){
    state.unterschriften[stateKey] = null;
    saveState();
    initSignaturePad(stateKey==='sachkundiger' ? 'sigSachkundiger' : 'sigKunde', stateKey);
    var ph = document.getElementById(stateKey==='sachkundiger' ? 'ph_sachkundiger' : 'ph_kunde');
    if(ph) ph.style.display = '';
  },
  erstelleExport: function(){
    if(!state.unterschriften.sachkundiger){
      alert('Bitte zuerst die Unterschrift des Sachkundigen/Prüfers erfassen.');
      return;
    }
    var fotoIds = sammleFotoIds();
    setExportStatus(fotoIds.length ? ('Fotos werden aufbereitet (0/' + fotoIds.length + ') …') : 'Bericht wird erstellt …');
    ladePdfFotos(fotoIds, function(n, gesamt){
      setExportStatus('Fotos werden aufbereitet (' + n + '/' + gesamt + ') …');
    }).then(function(){
      setExportStatus('Bericht wird erstellt …');
      return new Promise(function(r){ setTimeout(r, 30); });
    }).then(function(){
      var doc = buildPdfDoc();
      var pdfBlob = doc.output('blob');
      setExportStatus('ZIP wird gepackt …');
      buildZipBlob(pdfBlob, function(zipBlob){
        PDF_FOTOS = {};   // Speicher wieder freigeben
        AppActions._teileOderLade(zipBlob, dateienName('Begehung','zip'), 'application/zip');
      }, function(n, gesamt){
        setExportStatus('Fotos werden gepackt (' + n + '/' + gesamt + ') …');
      });
    }).catch(function(e){
      PDF_FOTOS = {};
      setExportStatus('Fehler: ' + (e && e.message ? e.message : e));
    });
  },
  _teileOderLade: function(blob, filename, mimeType){
    try { navigator.clipboard.writeText(FLAMMPUNKT_EXPORT_EMAIL).catch(function(){}); } catch(e){}
    var file;
    try { file = new File([blob], filename, { type: mimeType }); } catch(e){ file = null; }
    if(file && navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: 'Bericht über Brandschutzeinrichtungen', text: 'Bericht an ' + FLAMMPUNKT_EXPORT_EMAIL + ' senden (Outlook wählen).' })
        .then(function(){
          setExportStatus('Geteilt. E-Mail-Adresse ist in der Zwischenablage: ' + FLAMMPUNKT_EXPORT_EMAIL);
          AppActions._abschlussAbfrage();
        })
        .catch(function(err){
          if(err && err.name === 'AbortError'){
            setExportStatus('Teilen abgebrochen. Download als Alternative …');
            downloadBlob(blob, filename);
            AppActions._abschlussAbfrage();
          } else {
            downloadBlob(blob, filename);
            setExportStatus('Teilen nicht möglich, Datei wurde heruntergeladen.');
            AppActions._abschlussAbfrage();
          }
        });
    } else {
      downloadBlob(blob, filename);
      setExportStatus('Datei heruntergeladen. E-Mail-Adresse in Zwischenablage: ' + FLAMMPUNKT_EXPORT_EMAIL);
      AppActions._abschlussAbfrage();
    }
  },
  _abschlussAbfrage: function(){
    var loeschen = confirm('Bericht wurde gespeichert/verschickt.\n\nIst das Objekt damit abgeschlossen?\n\nOK = Daten jetzt vom Gerät löschen\nAbbrechen = Daten behalten (z. B. um später etwas nachzutragen)');
    if(loeschen){
      state = createEmptyState();
      saveState();
      FotoStore.leeren().catch(function(){});
      speicherWarnungAktiv = false;
      var bar = document.getElementById('speicherWarnung');
      if(bar) bar.style.display = 'none';
      render();
    }
  },
  neueBegehung: function(){
    if(!confirm('Wirklich eine neue, leere Begehung starten? Aktuelle Daten gehen verloren.')) return;
    state = createEmptyState();
    saveState();
    render();
  }
};
window.addEventListener('pagehide', saveStateSofort);
window.addEventListener('beforeunload', saveStateSofort);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') saveStateSofort(); });
document.getElementById('cameraInput').addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0];
  if(!file || !fotoZiel) return;
  var ziel = fotoZiel;
  resizeImage(file, 1400, 0.72, function(blob){
    if(!blob){ alert('Das Foto konnte nicht verarbeitet werden.'); fotoZiel = null; return; }
    FotoStore.put(blob).then(function(id){
      if(ziel.subId === '__stammdaten__'){
        currentEinheit().stammdatenFoto = id;
      } else {
        var antwort = getAntwortFor(currentEinheit(), ziel.subId, ziel.frageId);
        antwort.foto = id;
      }
      fotoZiel = null;
      saveState();
      render();
    }).catch(function(err){
      fotoZiel = null;
      zeigeSpeicherWarnung('Das Foto konnte nicht gespeichert werden (' + (err && err.name ? err.name : 'Fehler') + '). Bitte Speicherplatz auf dem Gerät prüfen.');
    });
  });
  e.target.value = '';
});
// Altbestand: Fotos, die noch als DataURL im Zustand liegen, einmalig nach
// IndexedDB umziehen. Danach steht im Zustand nur noch die ID.
function migriereAltfotos(){
  var auftraege = [];
  THEMA_ORDER.forEach(function(themaKey){
    var ts = state.themen[themaKey];
    if(!ts || !ts.einheiten) return;
    ts.einheiten.forEach(function(einheit){
      if(typeof einheit.stammdatenFoto === 'string' && einheit.stammdatenFoto.indexOf('data:') === 0){
        auftraege.push({ setzen: function(id){ einheit.stammdatenFoto = id; }, dataUrl: einheit.stammdatenFoto });
      }
      Object.keys(einheit.antworten || {}).forEach(function(k){
        var a = einheit.antworten[k];
        if(a && typeof a.foto === 'string' && a.foto.indexOf('data:') === 0){
          auftraege.push({ setzen: function(id){ a.foto = id; }, dataUrl: a.foto });
        }
      });
    });
  });
  if(auftraege.length === 0) return Promise.resolve(false);
  var kette = Promise.resolve();
  auftraege.forEach(function(auftrag){
    kette = kette.then(function(){
      return FotoStore.put(dataUrlZuBlob(auftrag.dataUrl)).then(function(id){ auftrag.setzen(id); });
    });
  });
  return kette.then(function(){ saveState(); return true; });
}

if(!FotoStore.verfuegbar()){
  zeigeSpeicherWarnung('Dieser Browser stellt keinen Fotospeicher (IndexedDB) bereit. Fotos können nicht gesichert werden.');
}
migriereAltfotos().then(function(migriert){ if(migriert) render(); }).catch(function(){});
render();
})();
</script>
